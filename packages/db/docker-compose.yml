name: rocket

services:
  postgres:
    image: postgres:18
    container_name: rocket-postgres
    environment:
      POSTGRES_DB: rocket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - rocket_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rocket_postgres_data:
